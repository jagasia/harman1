spring.application.name=spring-cloud-gateway

server.port=5000

# Customer Service Route
spring.cloud.gateway.server.webflux.routes[0].id=customer-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/customer/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Product Service Route
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# Sale Service Route
spring.cloud.gateway.server.webflux.routes[2].id=sale-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/sale/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1
