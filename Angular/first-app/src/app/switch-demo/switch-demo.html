
<select name="grade" [(ngModel)]="grade" class="form-select">
    <option>A</option>
    <option>B</option>
    <option>C</option>
    <option>D</option>
</select>
<br/>

<div [ngSwitch]="grade">
    <p *ngSwitchCase="'A'">Excellent</p>
    <p *ngSwitchCase="'B'">Good</p>
    <p *ngSwitchCase="'C'">Fair</p>
    <p *ngSwitchCase="'D'">Satisfactory</p>
</div>
