{{title}}
<form>
    Username: <input type="text" name="username" class="form-control" [(ngModel)]="username">
    Password: <input [type]="type" name="password" id="" class="form-control" [(ngModel)]="password">
    <br/>
    <label for="chkShowPassword">Show password:</label> <input id="chkShowPassword" type="checkbox" name="showPassword" [(ngModel)]="showPassword"><br/><br/>
    <input type="button" value="Login" class="btn btn-info" (click)="fnLogin()" >
    <br/>
    
</form>
<br/>
