<form [formGroup]="user">
Username: <input type="text" formControlName="username" class="form-control" >
Password: <input type="password" formControlName="password" class="form-control" >
Confirm Password: <input type="password" formControlName="cpassword" class="form-control" >
Email: <input type="email" formControlName="email" class="form-control" >
Phone: <input type="number" formControlName="phone" class="form-control" >
<br/>
</form>
<br/>
{{user.value | json}}
